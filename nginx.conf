# Serves the built SPA (Dockerfile) with a client-side-routing fallback: any path that doesn't
# match a real file (e.g. a direct load of /callback, react-router's OIDC redirect target -
# adr/0023) falls back to index.html and lets react-router's own client-side route matching take
# over from there, instead of nginx returning a bare 404 for anything but the exact root path.
#
# `15-08`: stock nginx sends no Cache-Control at all for a static file with no directive naming
# one - found live 2026-08-30 (ago-root's own docs/backlog/15-08-static-frontend-cache-headers.md
# has the incident) via ago-widget, which shares this gap. This SPA's two file classes need opposite
# policies, not one:
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's own default build names every file under assets/ with a content hash
    # (index-<hash>.js/.css, confirmed by building this repository, not assumed) - a new deploy
    # produces new filenames, so a cached copy under an old filename is simply never requested
    # again. Safe, and worth doing, to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html (and everything the SPA-routing fallback below resolves to it) has a fixed
    # filename that changes content on every deploy - the identical "always revalidate, never trust
    # a cached copy outright" reasoning ago-widget's own nginx.conf states in full.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

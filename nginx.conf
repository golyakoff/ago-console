# Serves the built SPA (Dockerfile) with a client-side-routing fallback: any path that doesn't
# match a real file (e.g. a direct load of /callback, react-router's OIDC redirect target -
# adr/0023) falls back to index.html and lets react-router's own client-side route matching take
# over from there, instead of nginx returning a bare 404 for anything but the exact root path.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      # `17-13`: `npm audit` exits 1 both when it finds a High/Critical advisory and when it cannot
      # reach the advisory endpoint at all. Under a step named "Vulnerability check", the second reads
      # as the first - on 2026-09-04 the registry answered 503 on three consecutive attempts and the
      # only log line was "Process completed with exit code 1", which says "vulnerable" to every
      # reader. They are opposite facts: one is something to fix, the other is nothing having been
      # checked.
      #
      # An outage still fails the build, deliberately. Passing on "could not look" is the silent
      # direction, and it would let a branch merge with its dependencies unchecked while CI reads
      # green - the same reasoning `tools/queue-audit.sh` (ago-root) states for an unreachable GitHub.
      # What changes is that the log now says which of the two happened.
      #
      # Three attempts with backoff, because a bulk POST to the registry is exactly the shape that
      # fails transiently. They are not a fix for a sustained outage and are not meant to be: if the
      # endpoint is genuinely down this stays red, and somebody decides with the reason visible.
      - name: Vulnerability check (npm audit)
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level=high 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if ! echo "$out" | grep -q 'audit endpoint returned an error'; then
              echo "::error title=Vulnerability found::npm audit reports a High or Critical advisory. Read the report above."
              exit 1
            fi
            echo "Attempt $attempt: the advisory endpoint did not answer. Retrying."
            sleep $((attempt * 10))
          done
          echo "::error title=Not checked, the advisory endpoint is unreachable::This is NOT a vulnerability finding. npm audit could not reach the registry on three attempts, so nothing was checked. See docs/runbooks/vulnerability-response.md in ago-root."
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Added 2026-08-25: this step was missing while ago-widget's otherwise-identical workflow had
      # it, so every test in this repository was unenforced on every PR - an omission rather than a
      # decision, found while reviewing 8-06.
      - name: Test
        run: npm test

      # `15-07`: this step used to override every VITE_* with a localhost placeholder. That was
      # harmless while CI published nothing, and became a trap the moment it did - process env wins
      # over .env files in Vite, so the job would have built and pushed a console pointed at
      # localhost under a tag naming a commit whose .env.production says otherwise. The overrides
      # are gone: CI now builds exactly what ships, from the committed .env.production, which is
      # also what makes adr/0051's "the commit determines the artifact" true here rather than
      # merely asserted. A broken .env.production now fails this step instead of hiding behind it.
      - name: Build
        run: npm run build

      # `15-11`: the rendered UX gate - a real-browser pass over the app's own production-shaped
      # build (`npm run build:ux-gate`, its own `.env.ux-gate`, run by `ux-gate/playwright.config.ts`'s
      # `webServer` step, not the `Build` step above), checking the three measurable defects
      # `docs/backlog/15-11-*.md` exists for (horizontal overflow, an unusably small control, WCAG AA
      # contrast) and publishing a screenshot of every screen at both viewports as a build artifact.
      # Placed after `Build` (this repo's own `tsc`/lint/test gates already ran) and before
      # `publish-images` - a rendered-UI defect fails the pull request before an image is ever built
      # from this commit, not after.
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Chromium only, not all three engines: this gate asserts one rendering engine's layout/contrast
      # output, the same trade-off `testing.md`'s "Live verification" level already accepts for this
      # repository - a Firefox/WebKit-specific rendering defect would not be caught, judged cheaper
      # here than tripling this step's install time and runtime for a portfolio project's CI budget.
      - name: Install Playwright's Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit still needs the runner's own OS packages Chromium links against - ubuntu-latest is
      # a fresh VM every run, so those never survive the cache the way `~/.cache/ms-playwright` does,
      # even when the browser binary itself was a hit.
      - name: Install Playwright's OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Rendered UX gate
        run: npm run ux-gate

      - name: Upload UX gate screenshots
        # Uploaded on failure too, not only on success - a screenshot of the screen a failing
        # assertion is describing is the more useful artifact exactly when the gate is red.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-gate-screenshots
          path: ux-gate/screenshots/
          retention-days: 30
          if-no-files-found: warn

  # `15-07`/`adr/0051`: the console image is published to GHCR from here, not built on the
  # deployment node. Only on `main`, and only after build-test passed - a pull request never
  # publishes, so a fork or a draft branch cannot put an image into the registry a deploy might
  # later reach for. Modelled directly on ago-chat's own publish-images job (adr/0047).
  publish-images:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A repository's own GITHUB_TOKEN can write to that repository's own package feed - the same
      # property adr/0018 already relies on for the NuGet feed, so publishing needs no new secret.
      # Only *reading* a private package would, which is exactly why adr/0047 wants these public.
      packages: write
    steps:
      - uses: actions/checkout@v7

      # No docker/login-action: `docker login` with the workflow token does the same thing with one
      # fewer third-party action in the supply chain.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Note what is NOT passed here: no VITE_* build arg of any kind. The bundle's configuration
      # comes from the committed .env.production, so this image is a function of the commit alone -
      # which is the only thing that lets ${{ github.sha }} be a truthful name for it (adr/0051).
      # `main` moves and exists only for convenience; deploy.sh refuses it, and there is
      # deliberately no `latest` at all.
      - name: Build the console image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/ago-console"
          docker build \
            --build-arg "GIT_COMMIT=${{ github.sha }}" \
            -t "${repo}:${{ github.sha }}" \
            -t "${repo}:main" \
            .

      # Proves the commit actually reached the served files, rather than only the tag. Cheap, and it
      # is the exact property 15-07 exists for - a published image that cannot name its own commit
      # is the 2026-08-25 failure with extra steps. `17-04` moved this check ahead of the push below -
      # it only ever needed the local image, so it was gaining nothing from running after push.
      - name: Check the image can name its own commit
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/ago-console"
          served=$(docker run --rm --entrypoint cat "${repo}:${{ github.sha }}" /usr/share/nginx/html/version.json)
          echo "$served"
          echo "$served" | grep -q '"commit":"${{ github.sha }}"'

      # `17-04`/`15-06`: scans before push - see ago-chat's ci.yml for the fuller reasoning (why
      # before push rather than after, the threshold, and why the Trivy image is pinned by digest
      # rather than trusted at a floating tag or through `aquasecurity/trivy-action`, whose tags and
      # whose Docker Hub image were both compromised in March 2026).
      - name: Scan image for known vulnerabilities (Trivy)
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/ago-console"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --format table \
            "${repo}:${{ github.sha }}"

      - name: Push the console image
        run: |
          set -euo pipefail
          repo="ghcr.io/${{ github.repository_owner }}/ago-console"
          docker push "${repo}:${{ github.sha }}"
          docker push "${repo}:main"

      - name: Summarise what was published
        run: |
          {
            echo "### Image published"
            echo
            echo "Deploy with: \`./deploy.sh console ${{ github.sha }}\` (ago-deploy/k8s, on the node)"
            echo
            echo "- \`ghcr.io/${{ github.repository_owner }}/ago-console:${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Exact gradient colors read live from https://brandbook.reserve-me.ru/logo.html's own .g
         element (getComputedStyle: linear-gradient(140deg, rgb(76,141,255), rgb(157,107,255))) -
         the same pair ago-landing/styles.css already names as its blue/violet custom properties
         in .brand .g. -->
    <!-- x1/y1/x2/y2 chosen so the gradient line matches CSS 140deg (measured clockwise from
         "up") across this box, without a gradientTransform. -->
    <linearGradient id="g" x1="11.4%" y1="4.1%" x2="88.6%" y2="95.9%">
      <stop offset="0%" stop-color="#4C8DFF"/>
      <stop offset="100%" stop-color="#9D6BFF"/>
    </linearGradient>
  </defs>
  <!-- Corner radius keeps `.brand .g`'s own ratio (8px on a 28px square, 2:7) so the mark reads as
       the same shape at any size. -->
  <rect x="0" y="0" width="100" height="100" rx="28.6" ry="28.6" fill="url(#g)"/>
  <!-- The "A", drawn as a bold stroked skeleton rather than set in a webfont: a favicon is rendered
       outside the page's own font-loading pipeline, so a shape that does not depend on a font
       resolving is the only way to guarantee the same glyph in every browser at 16px. -->
  <path d="M50 25 L29 77 M50 25 L71 77 M36.6 59 L63.4 59"
        fill="none" stroke="#fff" stroke-width="9.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
